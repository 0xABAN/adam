[project]
name = "adam-training"
version = "0.1.0"
description = "Fine-tune Qwen3-8B with a LoRA adapter so it texts like Adam"
requires-python = "==3.12.*"
dependencies = [
  # transformers and trl match Unsloth's official Qwen3 notebooks, and unsloth-zoo is
  # the version whose response masking was checked against this dataset.
  "unsloth==2026.10.3",
  "unsloth-zoo==2026.10.3",
  "transformers==4.57.6",
  "trl==0.22.2",
]

[tool.uv]
# Training needs a CUDA GPU, so resolve only for the Linux pods it runs on. On macOS,
# unsloth-zoo depends on MLX packages that conflict with the pinned transformers.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
